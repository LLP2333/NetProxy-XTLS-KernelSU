name: 构建与发布工作流

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/module/**'
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build_and_release:
    name: 构建与发布
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 更新并准备变量
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          sed -i "s/^versionCode=.*/versionCode=$COMMIT_COUNT/" src/module/module.prop
          VERSION=$(grep '^version=' src/module/module.prop | cut -d= -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_ENV

          # 定义包名
          echo "FULL_NAME=NetProxy_${VERSION}_${COMMIT_COUNT}.zip" >> $GITHUB_ENV
          echo "MINI_NAME=NetProxy_${VERSION}_${COMMIT_COUNT}_mini.zip" >> $GITHUB_ENV

      - name: 打包模块
        run: |
          cd src/module
          # 1. 完整包 (全部组件)
          7z a -tzip -mx=9 "../../${{ env.FULL_NAME }}" .
          # 2. 纯脚本包 (排除 Xray 二进制和 geodata)
          7z a -tzip -mx=9 "../../${{ env.MINI_NAME }}" . -x!"bin/xray" -x!"config/xray/geoip.dat" -x!"config/xray/geosite.dat"

      - name: 上传构建产物 (分支推送/手动触发)
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: NetProxy_${{ env.VERSION }}_${{ env.COMMIT_COUNT }}
          path: |
            ${{ env.FULL_NAME }}
            ${{ env.MINI_NAME }}

      # module.prop 的 updateJson 指向 releases/latest/download/update.json，
      # 由此处按实际标签名、版本号和 versionCode 生成，无需每次发布手动修改
      - name: 生成 update.json (Tag 触发)
        if: ${{ github.ref_type == 'tag' }}
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$COMMIT_COUNT" \
            --arg zipUrl "https://github.com/$REPO/releases/download/$TAG/$FULL_NAME" \
            --arg changelog "https://raw.githubusercontent.com/$REPO/$TAG/.github/changelog.md" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' \
            > update.json
          cat update.json

      - name: 发布 GitHub Release (Tag 触发)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/changelog.md
          files: |
            ${{ env.FULL_NAME }}
            ${{ env.MINI_NAME }}
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
