# NetProxy 模块设置

# 开机自动启动服务 (1=启用, 0=禁用)
AUTO_START=1

# ───── 透明代理（修改后重启服务生效）─────
# 透明代理端口（需与 Xray 配置中 dokodemo-door 入站端口一致）
TPROXY_PORT=12345

# 代理 IPv6 流量 (1=启用, 0=禁用)
# 禁用时 IPv6 流量不经过 Xray 直接出网；内核不支持 IPv6 TPROXY 时自动回退为仅 IPv4
PROXY_IPV6=1

# 代理热点 / USB 共享下游设备的流量 (1=启用, 0=禁用)
PROXY_HOTSPOT=1
# 共享网络下游接口，空格分隔，支持 iptables 通配符 +
HOTSPOT_INTERFACES="wlan2 ap+ swlan0 rndis+ ncm+"

# 分应用代理: off=全部代理, blacklist=列表内应用不代理, whitelist=仅代理列表内应用
APP_PROXY_MODE=off
# 应用列表，空格或英文逗号分隔；格式为 包名 或 用户ID:包名（如 10:com.example.app，默认用户 0）
APP_PROXY_LIST=""

# Xray 主配置文件路径
XRAY_CONFIG="/data/adb/modules/netproxy/config/xray/config.json"

# ───── geoip / geosite 更新（WebUI「更新 geoip / geosite」按钮或 cli geo update）─────
# 下载来源（默认 Loyalsoldier/v2ray-rules-dat，与 Xray-install 一致）
GEO_UPDATE_GEOIP_URL="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
GEO_UPDATE_GEOSITE_URL="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"

# 下载超时（秒）
GEO_UPDATE_TIMEOUT=60
